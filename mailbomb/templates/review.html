<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailBomb Review</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
            position: relative;
            z-index: 200;
        }
        .header h1 { font-size: 20px; color: #e94560; }
        .progress {
            font-size: 14px;
            color: #a0a0a0;
        }
        .progress strong { color: #e94560; }
        .mic-status {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            background: #0f3460;
            position: relative;
            z-index: 200;
        }
        .mic-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }
        .mic-dot.active { background: #4ecca3; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .thermometers {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            z-index: 50;
        }
        .thermo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .thermo-track {
            width: 18px;
            height: 220px;
            background: #0f3460;
            border-radius: 9px;
            position: relative;
            overflow: hidden;
            border: 1px solid #1a3a6e;
        }
        .thermo-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            border-radius: 0 0 8px 8px;
            transition: height 0.5s ease;
        }
        .thermo-fill.messages { background: #e94560; }
        .thermo-fill.size { background: #4ecca3; }
        .thermo-value {
            font-size: 11px;
            font-weight: 600;
            color: #e0e0e0;
            text-align: center;
            white-space: nowrap;
        }
        .thermo-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            text-align: center;
        }
        .container { max-width: 700px; margin: 40px auto; padding: 0 24px; }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 28px;
            border: 1px solid #0f3460;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .sender { font-size: 18px; font-weight: 600; color: #fff; }
        .sender-email { font-size: 14px; color: #a0a0a0; margin-top: 4px; }
        .score-badge {
            background: #e94560;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .stats {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #a0a0a0;
        }
        .stats strong { color: #4ecca3; }
        .subjects {
            margin-bottom: 16px;
        }
        .subjects h3 {
            font-size: 13px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
        }
        .subject-line {
            font-size: 14px;
            color: #c0c0c0;
            padding: 4px 0;
            border-bottom: 1px solid #0f3460;
        }
        .snippet-box {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #b0b0b0;
            max-height: 200px;
            overflow-y: auto;
        }
        .snippet-box h3 {
            font-size: 13px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.98); }
        .btn-trash { background: #e94560; color: #fff; }
        .btn-keep { background: #4ecca3; color: #1a1a2e; }
        .btn-skip { background: #0f3460; color: #a0a0a0; }
        .btn-rule { background: #533483; color: #fff; }
        .btn kbd {
            display: inline-block;
            background: rgba(0,0,0,0.2);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 6px;
        }
        .voice-heard {
            text-align: center;
            padding: 8px;
            margin-top: 12px;
            font-size: 13px;
            color: #4ecca3;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .voice-heard.show { opacity: 1; }
        .loading {
            text-align: center;
            padding: 60px;
            color: #a0a0a0;
            font-size: 18px;
        }
        .done {
            text-align: center;
            padding: 60px;
        }
        .done h2 { color: #4ecca3; margin-bottom: 12px; }
        .shortcuts {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #666;
        }
        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .nav-btn {
            background: #0f3460;
            color: #a0a0a0;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .nav-btn:hover { color: #fff; }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }
        .nav-position { font-size: 13px; color: #666; }
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a2e;
            z-index: 100;
            overflow-y: auto;
        }
        .overlay.visible { display: block; }
        .overlay-header {
            position: sticky;
            top: 0;
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
            z-index: 101;
        }
        .overlay-header h2 { font-size: 16px; color: #fff; }
        .overlay-close {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .overlay-body {
            max-width: 800px;
            margin: 32px auto;
            padding: 0 24px 60px;
            font-size: 15px;
            line-height: 1.8;
            color: #d0d0d0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        /* --- End session screen --- */
        .session-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a2e;
            z-index: 90;
            overflow-y: auto;
        }
        .session-screen.visible { display: block; }
        .session-header {
            position: sticky;
            top: 0;
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
            z-index: 91;
        }
        .session-header h2 { font-size: 18px; color: #e94560; }
        .session-summary {
            font-size: 14px;
            color: #a0a0a0;
        }
        .session-summary strong { color: #4ecca3; }
        .session-body {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 24px 60px;
        }
        .sender-group-header {
            font-size: 14px;
            font-weight: 600;
            color: #e94560;
            padding: 12px 0 6px;
            border-bottom: 1px solid #0f3460;
            margin-top: 16px;
        }
        .msg-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(15, 52, 96, 0.5);
            cursor: pointer;
            transition: background 0.15s;
        }
        .msg-row:hover { background: rgba(15, 52, 96, 0.4); border-radius: 4px; }
        .msg-subject {
            flex: 1;
            font-size: 14px;
            color: #c0c0c0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .msg-date {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }
        .msg-restore {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .msg-restore:hover { transform: scale(1.05); }
        .msg-restored {
            color: #4ecca3;
            font-size: 12px;
            font-style: italic;
            white-space: nowrap;
        }
        .session-actions {
            text-align: center;
            margin-top: 24px;
        }
        .btn-resume {
            background: #0f3460;
            color: #a0a0a0;
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-resume:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>MailBomb Review</h1>
        <div class="progress" id="progress">Loading...</div>
        <div class="mic-status" id="micToggle" onclick="toggleMic()">
            <div class="mic-dot" id="micDot"></div>
            <span id="micLabel">Mic off</span>
        </div>
    </div>
    <div class="thermometers">
        <div class="thermo">
            <div class="thermo-value" id="thermoMsgVal">0</div>
            <div class="thermo-track">
                <div class="thermo-fill messages" id="thermoMsgFill" style="height: 0%"></div>
            </div>
            <div class="thermo-label">msgs</div>
        </div>
        <div class="thermo">
            <div class="thermo-value" id="thermoSizeVal">0</div>
            <div class="thermo-track">
                <div class="thermo-fill size" id="thermoSizeFill" style="height: 0%"></div>
            </div>
            <div class="thermo-label">MB</div>
        </div>
    </div>
    <div class="container">
        <div id="content">
            <div class="loading">Loading patterns...</div>
        </div>
        <div class="shortcuts">
            Keyboard: <kbd>T</kbd> Toss &nbsp; <kbd>K</kbd> Keep &nbsp; <kbd>S</kbd> Skip &nbsp; <kbd>R</kbd> Rule &nbsp; <kbd>F</kbd> Full message &nbsp; <kbd>←</kbd><kbd>→</kbd> Navigate &nbsp; <kbd>Q</kbd> End session
        </div>
    </div>
    <div class="overlay" id="overlay">
        <div class="overlay-header">
            <h2 id="overlayTitle">Full Message</h2>
            <button class="overlay-close" onclick="closeOverlay()">Close <kbd>Esc</kbd></button>
        </div>
        <div class="overlay-body" id="overlayBody">Loading...</div>
    </div>
    <div class="session-screen" id="sessionScreen">
        <div class="session-header">
            <h2>Session Summary</h2>
            <div class="session-summary" id="sessionSummary"></div>
            <button class="btn-resume" onclick="resumeSession()">Resume Triage</button>
        </div>
        <div class="session-body" id="sessionBody">Loading...</div>
    </div>

    <script>
        let patterns = [];
        let currentIndex = 0;
        let stats = { trashed: 0, trashedSize: 0, reviewed: 0 };
        let totals = { messages: 1, size: 1 }; // fetched on init, defaults avoid /0
        let micActive = false;
        let recognition = null;
        let overlayOpen = false;
        let sessionScreenOpen = false;

        // --- Audio feedback ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            osc.type = "sine";
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.15);
        }
        function playBuzz() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 220;
            osc.type = "square";
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.25);
        }

        // --- Data ---
        async function loadPatterns() {
            const resp = await fetch("/api/patterns");
            patterns = await resp.json();
            if (patterns.length > 0) {
                showCard(0);
            } else {
                document.getElementById("content").innerHTML =
                    '<div class="done"><h2>All clear!</h2><p>No patterns to review.</p></div>';
            }
            updateProgress();
        }

        async function loadSnippet(gmailId) {
            const resp = await fetch(`/api/snippet/${gmailId}`);
            const data = await resp.json();
            return data.snippet || "[No preview available]";
        }

        // --- Rendering ---
        function showCard(index) {
            if (index >= patterns.length) {
                document.getElementById("content").innerHTML =
                    '<div class="done"><h2>All done!</h2><p>No more patterns to review this session.</p></div>';
                return;
            }
            currentIndex = index;
            const p = patterns[index];
            const sizeMB = (p.total_size / (1024 * 1024)).toFixed(1);
            const scorePercent = Math.min(100, Math.round(p.score));
            const subjects = (p.sample_subjects || [])
                .map(s => `<div class="subject-line">${escHtml(s)}</div>`)
                .join("");

            document.getElementById("content").innerHTML = `
                <div class="nav-row">
                    <button class="nav-btn" onclick="navigate(-1)" ${index === 0 ? "disabled" : ""}>← Back</button>
                    <span class="nav-position">${index + 1} / ${patterns.length}</span>
                    <button class="nav-btn" onclick="navigate(1)" ${index >= patterns.length - 1 ? "disabled" : ""}>Forward →</button>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="sender">${escHtml(p.sender_email)}</div>
                            ${p.list_id ? `<div class="sender-email">List: ${escHtml(p.list_id)}</div>` : ""}
                        </div>
                        <div class="score-badge">${scorePercent}% bulk</div>
                    </div>
                    <div class="stats">
                        <span><strong>${p.count.toLocaleString()}</strong> messages</span>
                        <span><strong>${sizeMB}</strong> MB</span>
                    </div>
                    <div class="subjects"><h3>Sample Subjects</h3>${subjects || "<em>No subjects</em>"}</div>
                    <div class="snippet-box" id="snippetBox">
                        <h3>Preview</h3>
                        <div id="snippetText">Loading...</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-trash" onclick="doAction('trash')">Toss <kbd>T</kbd></button>
                        <button class="btn btn-keep" onclick="doAction('keep')">Keep <kbd>K</kbd></button>
                        <button class="btn btn-skip" onclick="doAction('skip')">Skip <kbd>S</kbd></button>
                        <button class="btn btn-rule" onclick="doAction('rule')">Rule <kbd>R</kbd></button>
                    </div>
                    <div style="text-align:center; margin-top: 12px;">
                        <button class="nav-btn" onclick="showFullMessage()" style="padding: 8px 20px;">Show Full Message <kbd>F</kbd></button>
                    </div>
                    <div class="voice-heard" id="voiceHeard"></div>
                </div>
            `;

            // Load snippet
            if (p.sample_gmail_id) {
                loadSnippet(p.sample_gmail_id).then(text => {
                    const el = document.getElementById("snippetText");
                    if (el) el.textContent = text;
                });
            }
        }

        // --- Actions ---
        async function doAction(action) {
            if (overlayOpen) closeOverlay();
            const p = patterns[currentIndex];
            const body = JSON.stringify({
                sender_email: p.sender_email,
                list_id: p.list_id,
            });
            const opts = { method: "POST", headers: {"Content-Type": "application/json"}, body };

            if (action === "trash") {
                const resp = await fetch("/api/trash", opts);
                const data = await resp.json();
                stats.trashed += data.trashed;
                stats.trashedSize += p.total_size;
            } else if (action === "keep") {
                await fetch("/api/keep", opts);
            } else if (action === "skip") {
                await fetch("/api/skip", opts);
            } else if (action === "rule") {
                const resp = await fetch("/api/rule", opts);
                const data = await resp.json();
                stats.trashed += data.trashed;
                stats.trashedSize += p.total_size;
            }

            // Track high-water mark for reviewed count
            if (currentIndex + 1 > stats.reviewed) stats.reviewed = currentIndex + 1;
            updateProgress();
            showCard(currentIndex + 1);
        }

        function updateProgress() {
            const sizeMB = (stats.trashedSize / (1024 * 1024)).toFixed(1);
            document.getElementById("progress").innerHTML =
                `Reviewed <strong>${stats.reviewed}</strong>/${patterns.length} — ` +
                `<strong>${stats.trashed.toLocaleString()}</strong> trashed (${sizeMB} MB)`;
            updateThermometers();
        }

        function updateThermometers() {
            const msgPct = Math.min(100, (stats.trashed / totals.messages) * 100);
            const sizePct = Math.min(100, (stats.trashedSize / totals.size) * 100);
            document.getElementById("thermoMsgFill").style.height = msgPct + "%";
            document.getElementById("thermoSizeFill").style.height = sizePct + "%";
            document.getElementById("thermoMsgVal").textContent = stats.trashed.toLocaleString();
            const mb = (stats.trashedSize / (1024 * 1024)).toFixed(1);
            document.getElementById("thermoSizeVal").textContent = mb;
        }

        async function loadTotals() {
            const resp = await fetch("/api/stats");
            const data = await resp.json();
            totals.messages = data.active_count || 1;
            totals.size = data.active_size || 1;
        }

        // --- Navigation ---
        function navigate(delta) {
            const newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < patterns.length) {
                if (overlayOpen) closeOverlay();
                showCard(newIndex);
            }
        }

        // --- Full message overlay ---
        async function showFullMessage() {
            const p = patterns[currentIndex];
            if (!p || !p.sample_gmail_id) return;
            document.getElementById("overlayTitle").textContent =
                `Full Message — ${p.sender_email}`;
            document.getElementById("overlayBody").textContent = "Loading full message...";
            document.getElementById("overlay").classList.add("visible");
            overlayOpen = true;

            const resp = await fetch(`/api/fullmessage/${p.sample_gmail_id}`);
            const data = await resp.json();
            document.getElementById("overlayBody").textContent = data.body || "[No content]";
        }

        function closeOverlay() {
            document.getElementById("overlay").classList.remove("visible");
            overlayOpen = false;
        }

        // --- Keyboard ---
        document.addEventListener("keydown", (e) => {
            if (e.target.tagName === "INPUT") return;
            if (e.key === "Escape") {
                if (overlayOpen) { closeOverlay(); return; }
                if (sessionScreenOpen) { resumeSession(); return; }
                return;
            }
            if (sessionScreenOpen) return;
            switch (e.key) {
                case "ArrowLeft": navigate(-1); return;
                case "ArrowRight": navigate(1); return;
            }
            switch (e.key.toLowerCase()) {
                case "t": doAction("trash"); break;
                case "k": doAction("keep"); break;
                case "s": doAction("skip"); break;
                case "r": doAction("rule"); break;
                case "f": showFullMessage(); break;
                case "q": showSessionScreen(); break;
            }
        });

        // --- Voice ---
        function setupVoice() {
            if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
                document.getElementById("micLabel").textContent = "No mic support";
                return;
            }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const last = event.results[event.results.length - 1];
                if (!last.isFinal) return;
                const text = last[0].transcript.trim().toLowerCase();
                let matched = true;

                if (text.includes("toss") || text.includes("trash")) {
                    doAction("trash");
                } else if (text.includes("keep")) {
                    doAction("keep");
                } else if (text.includes("skip") || text.includes("next")) {
                    doAction("skip");
                } else if (text.includes("rule")) {
                    doAction("rule");
                } else if (text.includes("show") || text.includes("full")) {
                    showFullMessage();
                } else if (text.includes("back") || text.includes("previous")) {
                    navigate(-1);
                } else if (text.includes("forward")) {
                    navigate(1);
                } else if (text.includes("close")) {
                    closeOverlay();
                } else if (text.includes("quit") || text.includes("done") || text.includes("stop") || text.includes("end")) {
                    showSessionScreen();
                } else {
                    matched = false;
                }

                if (matched) {
                    playBeep();
                    showVoiceHeard(text);
                } else {
                    playBuzz();
                    showVoiceHeard(text, true);
                }
            };

            recognition.onend = () => {
                if (micActive) recognition.start();
            };
        }

        function toggleMic() {
            if (!recognition) return;
            micActive = !micActive;
            if (micActive) {
                recognition.start();
                document.getElementById("micDot").classList.add("active");
                document.getElementById("micLabel").textContent = "Listening";
            } else {
                recognition.stop();
                document.getElementById("micDot").classList.remove("active");
                document.getElementById("micLabel").textContent = "Mic off";
            }
        }

        function showVoiceHeard(text, unrecognized = false) {
            const el = document.getElementById("voiceHeard");
            if (!el) return;
            if (unrecognized) {
                el.textContent = `Didn't understand: "${text}"`;
                el.style.color = "#e94560";
            } else {
                el.textContent = `Heard: "${text}"`;
                el.style.color = "#4ecca3";
            }
            el.classList.add("show");
            setTimeout(() => el.classList.remove("show"), 2500);
        }

        function escHtml(s) {
            const d = document.createElement("div");
            d.textContent = s || "";
            return d.innerHTML;
        }

        // --- End Session ---
        async function showSessionScreen() {
            sessionScreenOpen = true;
            if (overlayOpen) closeOverlay();
            const resp = await fetch("/api/session-trashed");
            const messages = await resp.json();

            const sizeMB = (stats.trashedSize / (1024 * 1024)).toFixed(1);
            document.getElementById("sessionSummary").innerHTML =
                `<strong>${stats.trashed.toLocaleString()}</strong> messages trashed — <strong>${sizeMB}</strong> MB`;

            if (messages.length === 0) {
                document.getElementById("sessionBody").innerHTML =
                    '<div style="text-align:center;padding:40px;color:#666;">No messages trashed this session.</div>';
            } else {
                // Group by sender
                const groups = {};
                messages.forEach(m => {
                    if (!groups[m.sender_email]) groups[m.sender_email] = [];
                    groups[m.sender_email].push(m);
                });

                let html = '<p style="color:#666;font-size:13px;margin-bottom:16px;">Click any message to read it. Restore individual messages if they were trashed by mistake.</p>';
                for (const [sender, msgs] of Object.entries(groups)) {
                    html += `<div class="sender-group-header">${escHtml(sender)} (${msgs.length})</div>`;
                    msgs.forEach(m => {
                        html += `
                            <div class="msg-row" id="row-${m.gmail_id}">
                                <span class="msg-subject" onclick="viewSessionMessage('${m.gmail_id}')">${escHtml(m.subject || '(no subject)')}</span>
                                <span class="msg-date">${escHtml(m.date || '')}</span>
                                <button class="msg-restore" onclick="event.stopPropagation(); restoreMessage('${m.gmail_id}', ${m.size_bytes || 0})">Restore</button>
                            </div>`;
                    });
                }
                document.getElementById("sessionBody").innerHTML = html;
            }
            document.getElementById("sessionScreen").classList.add("visible");
        }

        function resumeSession() {
            document.getElementById("sessionScreen").classList.remove("visible");
            sessionScreenOpen = false;
        }

        async function viewSessionMessage(gmailId) {
            // Reuse the full message overlay
            document.getElementById("overlayTitle").textContent = "Full Message";
            document.getElementById("overlayBody").textContent = "Loading...";
            document.getElementById("overlay").classList.add("visible");
            overlayOpen = true;

            const resp = await fetch(`/api/fullmessage/${gmailId}`);
            const data = await resp.json();
            document.getElementById("overlayBody").textContent = data.body || "[No content]";
        }

        async function restoreMessage(gmailId, sizeBytes) {
            const resp = await fetch("/api/untrash", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ gmail_ids: [gmailId] }),
            });
            const data = await resp.json();
            if (data.restored > 0) {
                stats.trashed -= 1;
                stats.trashedSize -= sizeBytes;
                updateProgress();
                updateThermometers();
                // Update row in place
                const row = document.getElementById(`row-${gmailId}`);
                if (row) {
                    const btn = row.querySelector(".msg-restore");
                    if (btn) {
                        btn.outerHTML = '<span class="msg-restored">Restored</span>';
                    }
                    row.style.opacity = "0.5";
                }
                // Update summary
                const sizeMB = (stats.trashedSize / (1024 * 1024)).toFixed(1);
                document.getElementById("sessionSummary").innerHTML =
                    `<strong>${stats.trashed.toLocaleString()}</strong> messages trashed — <strong>${sizeMB}</strong> MB`;
            }
        }

        // --- Init ---
        setupVoice();
        loadTotals();
        loadPatterns();
        // Prefetch snippets in background
        fetch("/api/prefetch", { method: "POST" });
    </script>
</body>
</html>
